name: Prototype Ingestion Pipeline

on:
  push:
    branches: [main]
    paths:
      - "src/pages/**"
  workflow_dispatch:
    inputs:
      slugs:
        description: "Comma-separated prototype slugs to process (e.g. employees,payroll-onboarding). Leave empty to auto-detect from last commit."
        required: false
        default: ""

env:
  ADO_ORG_URL: https://dev.azure.com/ViewpointVSO
  ADO_PROJECT: Lista
  ADO_AREA_PATH: Lista
  ADO_ITERATION_PATH: Lista
  ADO_WORK_ITEM_TYPE: User Story
  ADO_TEAM: Lista Team
  ADO_BOARD_NAME: Stories
  ADO_BOARD_COLUMN: Input Q
  ADO_BOARD_LANE: UI Prototype

concurrency:
  group: prototype-ingestion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ingest-prototype:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Lint & Validate
        run: npm run lint:all

      - name: Run Tests
        run: npm test

      # Phase 2: Change detection
      - name: Detect Changes
        id: detect
        run: |
          INPUT_SLUGS="${{ github.event.inputs.slugs }}"
          if [ -n "$INPUT_SLUGS" ]; then
            SLUGS=$(echo "$INPUT_SLUGS" | sed 's/"//g' | tr ',' '\n' | sed 's/^ *//;s/ *$//' | jq -R . | jq -sc .)
            echo "Using manually provided slugs: $SLUGS"
            echo "slugs=$SLUGS" >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            node .github/scripts/detect-changes.js
          fi

      - name: Skip if no changes
        if: steps.detect.outputs.has_changes == 'false'
        run: echo "No prototype page changes detected. Skipping downstream steps."

      # Phase 2: Route resolution
      - name: Resolve Routes
        id: routes
        if: steps.detect.outputs.has_changes == 'true'
        env:
          INPUT_SLUGS: ${{ steps.detect.outputs.slugs }}
          FILES_BY_SLUG: ${{ steps.detect.outputs.files_by_slug }}
        run: node .github/scripts/resolve-routes.js

      # Phase 3: Agentic infrastructure (setup once, reuse for all prototypes)
      - name: Install Playwright Chromium
        if: steps.detect.outputs.has_changes == 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright MCP & Copilot CLI
        if: steps.detect.outputs.has_changes == 'true'
        run: npm install -g @playwright/mcp @github/copilot

      - name: Start Dev Server
        if: steps.detect.outputs.has_changes == 'true'
        run: |
          npm run dev &
          for i in $(seq 1 30); do
            curl -s http://localhost:5173 > /dev/null 2>&1 && break
            if [ "$i" -eq 30 ]; then
              echo "::error::Dev server failed to start within 30 seconds"
              exit 1
            fi
            sleep 1
          done
          echo "Dev server ready on http://localhost:5173"

      # Phase 3: Screenshot and metadata extraction
      - name: Generate Screenshot Prompts
        id: screenshots
        if: steps.detect.outputs.has_changes == 'true'
        env:
          INPUT_ROUTES: ${{ steps.routes.outputs.routes }}
        run: node .github/scripts/capture-screenshots.js

      - name: Capture Screenshots
        if: steps.detect.outputs.has_changes == 'true'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          PROMPTS: ${{ steps.screenshots.outputs.prompts }}
        run: |
          mkdir -p screenshots
          MCP_CONFIG='{"mcpServers":{"playwright":{"command":"npx","args":["@playwright/mcp@latest","--headless"]}}}'
          FAILED=0
          for row in $(echo "$PROMPTS" | jq -r '.[] | @base64'); do
            SLUG=$(echo "$row" | base64 -d | jq -r '.slug')
            PROMPT=$(echo "$row" | base64 -d | jq -r '.prompt')
            copilot --allow-tool='playwright' \
              --deny-tool='write' --deny-tool='shell' \
              --additional-mcp-config "$MCP_CONFIG" \
              -p "$PROMPT" -s --no-ask-user || {
              echo "WARNING: Screenshot capture failed for $SLUG"
              FAILED=$((FAILED + 1))
            }
          done
          if [ "$FAILED" -gt 0 ]; then
            echo "WARNING: $FAILED screenshot capture(s) failed. See logs above."
          fi

      - name: Verify No Source Modifications
        if: steps.detect.outputs.has_changes == 'true'
        run: |
          DIRTY=0
          if ! git diff --exit-code -- src/; then
            echo "::error::Agent modified existing source files during screenshot capture."
            git checkout -- src/
            DIRTY=1
          fi
          UNTRACKED=$(git ls-files -z --others --exclude-standard -- src/)
          if [ -n "$UNTRACKED" ]; then
            echo "::error::Agent created new files under src/ during screenshot capture:"
            echo "$UNTRACKED" | tr '\0' '\n'
            echo "$UNTRACKED" | xargs -0 rm --
            DIRTY=1
          fi
          if [ "$DIRTY" -ne 0 ]; then
            echo "::error::Source integrity check failed. Originals restored."
            exit 1
          fi

      - name: Upload Screenshots
        if: steps.detect.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: prototype-screenshots
          path: screenshots/
          retention-days: 30

      - name: Generate Metadata Prompts
        id: metadata
        if: steps.detect.outputs.has_changes == 'true'
        env:
          INPUT_SLUGS: ${{ steps.detect.outputs.slugs }}
          FILES_BY_SLUG: ${{ steps.detect.outputs.files_by_slug }}
        run: node .github/scripts/extract-metadata.js

      - name: Extract Metadata (with validation + retry)
        if: steps.detect.outputs.has_changes == 'true'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          METADATA_MAX_RETRIES: "2"
          METADATA_OUTPUT_DIR: metadata
          METADATA_PROMPTS: ${{ steps.metadata.outputs.prompts }}
        run: echo "$METADATA_PROMPTS" | node .github/scripts/run-metadata-extraction.js

      # Phase 4: ADO integration
      - name: Compose Work Item Input
        id: compose
        if: steps.detect.outputs.has_changes == 'true'
        env:
          ROUTES: ${{ steps.routes.outputs.routes }}
        run: |
          INPUT='{}'
          for meta_file in metadata/*.json; do
            [ -f "$meta_file" ] || continue
            SLUG=$(basename "$meta_file" .json)
            SCREENSHOTS=$(find screenshots -name "${SLUG}*.png" 2>/dev/null | jq -R . | jq -s .) || SCREENSHOTS='[]'
            ROUTE=$(echo "$ROUTES" | jq -r --arg slug "$SLUG" '.[$slug] | if type == "array" then join(", ") else . end // ""')
            SOURCE_PATH=$(node -e "
              const slug = '$SLUG';
              const fs = require('fs');
              const path = require('path');
              const pagesDir = 'src/pages';
              // Direct directory match
              if (fs.existsSync(path.join(pagesDir, slug))) { console.log(path.join(pagesDir, slug)); process.exit(0); }
              // Nested directory: split slug at '-' to find valid path
              const parts = slug.split('-');
              for (let i = 1; i < parts.length; i++) {
                const nested = path.join(pagesDir, parts.slice(0, i).join('-'), parts.slice(i).join('-'));
                if (fs.existsSync(nested)) { console.log(nested); process.exit(0); }
              }
              // Single-file page
              const pascal = slug.split('-').map(p => p[0].toUpperCase() + p.slice(1).toLowerCase()).join('');
              console.log(path.join(pagesDir, pascal + '.tsx'));
            ")
            RAW=$(cat "$meta_file") || {
              echo "WARNING: Could not read $meta_file, skipping"
              continue
            }
            ENTRY=$(echo "$RAW" | jq --argjson ss "$SCREENSHOTS" --arg route "$ROUTE" --arg srcPath "$SOURCE_PATH" '{
              name: .name,
              slug: .slug,
              route: $route,
              sourcePath: $srcPath,
              metadata: { components: (.components // []), interactiveElements: (.interactiveElements // []) },
              screenshots: $ss
            }') || {
              echo "WARNING: Malformed JSON in $meta_file, skipping"
              continue
            }
            INPUT=$(echo "$INPUT" | jq --arg slug "$SLUG" --argjson entry "$ENTRY" '. + {($slug): $entry}')
          done
          if [ "$INPUT" = '{}' ]; then
            echo "No metadata files found, skipping work item creation."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            DELIM="EOFINPUT${GITHUB_RUN_ID}"
            echo "input<<${DELIM}" >> "$GITHUB_OUTPUT"
            echo "$INPUT" >> "$GITHUB_OUTPUT"
            echo "${DELIM}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create ADO Work Items
        id: ado
        if: steps.detect.outputs.has_changes == 'true' && steps.compose.outputs.skip != 'true'
        env:
          AZDO_PAT: ${{ secrets.AZDO_PAT }}
          COMMIT_SHA: ${{ github.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          WORK_ITEM_INPUT: ${{ steps.compose.outputs.input }}
        run: node .github/scripts/create-ado-workitems.js

      # Phase 5: Workflow summary
      - name: Generate Workflow Summary
        if: always()
        env:
          SUMMARY_SLUGS: ${{ steps.detect.outputs.slugs }}
          SUMMARY_WORKITEMS: ${{ steps.ado.outputs.workitems }}
          SUMMARY_ERRORS: ${{ steps.ado.outputs.errors }}
        run: node .github/scripts/generate-summary.js
