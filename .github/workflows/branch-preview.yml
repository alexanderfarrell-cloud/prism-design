# Deploy branch preview to GitHub Pages
#
# Builds the Vite app and deploys to /branches/{slug}/ on gh-pages.
# Skips deployment if the branch already has a merged PR (defense-in-depth
# guard against post-merge pushes re-deploying a cleaned-up preview).
#
# Part of the GitHub Pages deployment strategy:
# - deploy-main.yml: production deploy
# - branch-preview.yml: feature branch previews (this file)
# - cleanup-merged-branch.yml: remove previews on PR merge
# - cleanup-stale-previews.yml: weekly reconciliation safety net

name: Branch preview

on:
  push:
    branches-ignore:
      - main
      - gh-pages

concurrency:
  group: branch-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      pages: read

    steps:
      - name: Check for merged PR
        id: pr-check
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const { data: openPrs } = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${branch}`,
              state: 'open',
              per_page: 1
            });
            const hasOpenPr = openPrs.length > 0;

            const query = `repo:${owner}/${repo} is:pr is:merged head:${owner}:${branch}`;
            const { data: searchResult } = await github.rest.search.issuesAndPullRequests({
              q: query,
              per_page: 1
            });
            const hasMergedPr = searchResult.total_count > 0;

            const skip = hasMergedPr && !hasOpenPr;

            if (skip) {
              core.info(`Branch "${branch}" has a merged PR and no open PR — skipping preview deploy.`);
            }

            core.setOutput('skip', skip.toString());

      - name: Checkout
        if: success() && steps.pr-check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        if: success() && steps.pr-check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        if: success() && steps.pr-check.outputs.skip != 'true'
        run: npm ci

      - name: Compute branch slug
        if: success() && steps.pr-check.outputs.skip != 'true'
        id: branch
        run: |
          BRANCH="${{ github.ref_name }}"
          SLUG=$(echo "$BRANCH" | sed 's/[^a-zA-Z0-9_.-]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
          REPO="${{ github.event.repository.name }}"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "base_path=/$REPO/branches/$SLUG/" >> "$GITHUB_OUTPUT"

      - name: Build
        if: success() && steps.pr-check.outputs.skip != 'true'
        run: npm run build -- --base=${{ steps.branch.outputs.base_path }}

      - name: Checkout gh-pages
        if: success() && steps.pr-check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy build to branch subdirectory
        if: success() && steps.pr-check.outputs.skip != 'true'
        run: |
          rm -rf gh-pages/branches/${{ steps.branch.outputs.slug }}
          mkdir -p gh-pages/branches/${{ steps.branch.outputs.slug }}
          cp -r dist/* gh-pages/branches/${{ steps.branch.outputs.slug }}/

      - name: Deploy SPA 404.html and .nojekyll to root
        if: success() && steps.pr-check.outputs.skip != 'true'
        run: |
          cp -f dist/404.html gh-pages/404.html
          cp -f dist/.nojekyll gh-pages/.nojekyll

      - name: Update branches.json
        if: success() && steps.pr-check.outputs.skip != 'true'
        run: |
          MANIFEST="gh-pages/branches.json"
          SLUG="${{ steps.branch.outputs.slug }}"
          BRANCH="${{ steps.branch.outputs.name }}"
          NEW=$(jq -n --arg s "$SLUG" --arg b "$BRANCH" --arg u "/branches/$SLUG/" '{($s): {url: $u, branch: $b}}')
          if [ -f "$MANIFEST" ]; then
            jq -s '.[0] * .[1]' "$MANIFEST" - <<< "$NEW" > "${MANIFEST}.tmp"
            mv "${MANIFEST}.tmp" "$MANIFEST"
          else
            echo "$NEW" > "$MANIFEST"
          fi

      - name: Push to gh-pages
        if: success() && steps.pr-check.outputs.skip != 'true'
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add branches/${{ steps.branch.outputs.slug }} branches.json 404.html .nojekyll
          git diff --staged --quiet || git commit -m "Deploy branch ${{ steps.branch.outputs.name }} preview"
          git push origin gh-pages

      - name: Comment on PR with preview URL
        if: success() && steps.pr-check.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = '${{ steps.branch.outputs.name }}';
            const slug = '${{ steps.branch.outputs.slug }}';
            const repo = context.repo;
            const { data: prs } = await github.rest.pulls.list({
              owner: repo.owner,
              repo: repo.repo,
              state: 'open',
              head: `${repo.owner}:${branch}`
            });
            if (prs.length === 0) return;
            const pr = prs[0];
            const { data: pages } = await github.rest.repos.getPages({
              owner: repo.owner,
              repo: repo.repo
            });
            const siteUrl = pages.html_url.replace(/\/$/, '');
            const previewUrl = `${siteUrl}/branches/${slug}/`;
            const marker = '<!-- deploy-preview -->';
            const body = `${marker}\nPreview deployed: ${previewUrl}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: repo.owner,
              repo: repo.repo,
              issue_number: pr.number
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: repo.owner,
                repo: repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: repo.owner,
                repo: repo.repo,
                issue_number: pr.number,
                body
              });
            }
