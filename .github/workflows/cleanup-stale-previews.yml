# Cleanup Stale Branch Previews
#
# Reconciles branches.json on gh-pages against actual remote state.
# Removes previews for branches that:
#   - No longer exist on the remote, OR
#   - Have a merged PR (and no currently open PR)
#
# Closed-without-merge PRs are intentionally kept because designers
# may close a PR to restructure while still iterating on the branch.
#
# Runs weekly on Monday at 6 AM UTC and supports manual trigger.
# Safety net for edge cases not caught by cleanup-merged-branch.yml.
#
# Part of the GitHub Pages deployment strategy:
# - deploy-main.yml: production deploy
# - branch-preview.yml: feature branch previews
# - cleanup-merged-branch.yml: remove previews on PR merge
# - cleanup-stale-previews.yml: weekly reconciliation safety net (this file)

name: Cleanup stale branch previews

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

concurrency:
  group: cleanup-stale-previews
  cancel-in-progress: false

jobs:
  cleanup-stale:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Reconcile branch previews
        id: reconcile
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const manifestPath = 'branches.json';
            if (!fs.existsSync(manifestPath)) {
              core.info('No branches.json found, nothing to reconcile.');
              core.setOutput('cleaned', '0');
              return;
            }

            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            const slugs = Object.keys(manifest);
            if (slugs.length === 0) {
              core.info('branches.json is empty, nothing to reconcile.');
              core.setOutput('cleaned', '0');
              return;
            }

            core.info(`Found ${slugs.length} branch preview(s) to check: ${slugs.join(', ')}`);

            const stale = [];

            for (const slug of slugs) {
              const entry = manifest[slug];
              const branch = entry.branch;

              let branchExists = false;
              try {
                await github.rest.repos.getBranch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  branch: branch
                });
                branchExists = true;
              } catch (e) {
                if (e.status === 404) {
                  branchExists = false;
                } else {
                  throw e;
                }
              }

              if (!branchExists) {
                core.info(`  "${slug}": branch "${branch}" no longer exists — marking stale`);
                stale.push(slug);
                continue;
              }

              const { data: openPrs } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: `${context.repo.owner}:${branch}`,
                state: 'open',
                per_page: 1
              });

              if (openPrs.length > 0) {
                core.info(`  "${slug}": branch "${branch}" has an open PR — keeping`);
                continue;
              }

              const { data: closedPrs } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: `${context.repo.owner}:${branch}`,
                state: 'closed',
                per_page: 10
              });

              const hasMergedPr = closedPrs.some(pr => pr.merged_at !== null);
              if (hasMergedPr) {
                core.info(`  "${slug}": branch "${branch}" has a merged PR and no open PR — marking stale`);
                stale.push(slug);
                continue;
              }

              if (closedPrs.length > 0) {
                core.info(`  "${slug}": branch "${branch}" has closed (not merged) PR(s) — keeping (designer may be iterating)`);
                continue;
              }

              core.info(`  "${slug}": branch "${branch}" is active — keeping`);
            }

            if (stale.length === 0) {
              core.info('No stale previews found.');
              core.setOutput('cleaned', '0');
              return;
            }

            core.info(`\nRemoving ${stale.length} stale preview(s): ${stale.join(', ')}`);

            for (const slug of stale) {
              const dir = path.join('branches', slug);
              if (fs.existsSync(dir)) {
                fs.rmSync(dir, { recursive: true, force: true });
                core.info(`  Deleted directory: ${dir}`);
              }
              delete manifest[slug];
            }

            fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
            core.info('Updated branches.json');

            core.setOutput('cleaned', stale.length.toString());
            core.setOutput('removed', stale.join(', '));

      - name: Commit and push
        if: steps.reconcile.outputs.cleaned != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Cleanup ${{ steps.reconcile.outputs.cleaned }} stale branch preview(s): ${{ steps.reconcile.outputs.removed }}"
          git push origin gh-pages

      - name: Summary
        if: always()
        run: |
          echo "## Branch Preview Cleanup" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.reconcile.outputs.cleaned }}" = "0" ]; then
            echo "No stale previews found." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Removed **${{ steps.reconcile.outputs.cleaned }}** stale preview(s): ${{ steps.reconcile.outputs.removed }}" >> "$GITHUB_STEP_SUMMARY"
          fi
