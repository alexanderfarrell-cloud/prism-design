# Deploy main branch to GitHub Pages root
#
# Builds the Vite app and deploys to the gh-pages branch root.
# Preserves /branches/ subdirectories and branches.json for branch previews.
#
# Part of the GitHub Pages deployment strategy:
# - deploy-main.yml: production deploy (this file)
# - branch-preview.yml: feature branch previews
# - cleanup-merged-branch.yml: remove previews on PR merge
# - cleanup-stale-previews.yml: weekly reconciliation safety net

name: Deploy main

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-pages-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to gh-pages root
        run: |
          cd gh-pages
          find . -maxdepth 1 ! -name '.' ! -name '.git' ! -name 'branches' ! -name 'branches.json' -exec rm -rf {} +
          cp -r ../dist/* .
          git add -A
          git status

      - name: Push to gh-pages
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --staged --quiet || git commit -m "Deploy main to GitHub Pages"
          git push origin gh-pages
