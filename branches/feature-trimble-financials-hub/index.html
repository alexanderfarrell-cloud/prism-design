  <body>
    <script>
      // SPA redirect restoration for GitHub Pages.
      // Companion to 404.html — reads the encoded route from ?p= and
      // restores the correct URL via history.replaceState before React mounts.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var p = params.get('p');
        if (p) {
          var q = params.get('q');
          var base = window.location.pathname.replace(/\/$/, '');
          window.history.replaceState(null, '', base + p + (q || '') + window.location.hash);
        }
      })();
    </script>
    <div id="root"></div>
  </body>
